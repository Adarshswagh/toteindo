<!DOCTYPE html>
<html>
<head>
  <title>Logo Renderer</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
    }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }
  </style>
  <!-- Load PDF.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    async function renderLogo() {
      try {
        const url = '/images/logo/toteindo- logo.pdf';
        const loadingTask = pdfjsLib.getDocument(url);
        const pdf = await loadingTask.promise;
        const page = await pdf.getPage(1);
        
        // Renders at 1200x1200px canvas size
        const viewport = page.getViewport({ scale: 2.0 });
        
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        
        // Render PDF page into canvas context
        const renderContext = {
          canvasContext: context,
          viewport: viewport
        };
        
        await page.render(renderContext).promise;
        console.log('RENDER_COMPLETE');
        document.body.setAttribute('data-status', 'ready');
      } catch (err) {
        console.error(err);
        document.body.setAttribute('data-status', 'error');
      }
    }

    renderLogo();
  </script>
</body>
</html>
