<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <!-- Background -->
  <rect width="280" height="80" fill="transparent"/>
  
  <!-- Top decorative line -->
  <line x1="20" y1="14" x2="260" y2="14" stroke="#B38A4D" stroke-width="0.5"/>
  
  <!-- Brand Name -->
  <text x="140" y="46" 
    font-family="Cormorant Garamond, Georgia, serif"
    font-size="32" 
    font-weight="600"
    fill="#7E1323"
    text-anchor="middle"
    letter-spacing="8">TOTEINDO</text>
  
  <!-- Tagline -->
  <text x="140" y="64" 
    font-family="Jost, Arial, sans-serif"
    font-size="7.5" 
    font-weight="400"
    fill="#B38A4D"
    text-anchor="middle"
    letter-spacing="4">CRAFTED TO PERFECTION</text>
  
  <!-- Bottom decorative line -->
  <line x1="20" y1="72" x2="260" y2="72" stroke="#B38A4D" stroke-width="0.5"/>
  
  <!-- Small gold dots -->
  <circle cx="14" cy="14" r="2" fill="#B38A4D"/>
  <circle cx="266" cy="14" r="2" fill="#B38A4D"/>
  <circle cx="14" cy="72" r="2" fill="#B38A4D"/>
  <circle cx="266" cy="72" r="2" fill="#B38A4D"/>
</svg>
